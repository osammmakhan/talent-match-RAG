<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 64 64" fill="none">
  <!--
    Reproduces the header .brand-mark exactly, from frontend/src/App.css:
    a 16x16 #3b82f6 square with 2px corners holding a centred 6x6 #000
    square with 0.5px corners. Coordinates are that geometry scaled by 4.
  -->
  <rect width="64" height="64" rx="8" fill="#3b82f6"/>
  <rect x="20" y="20" width="24" height="24" rx="2" fill="#000000"/>
</svg>
